name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          PROJECT_NAME: mylyfe
          CONTENT_URL: https://github.com/${{ github.repository }}
          PROJECT_ENVIRONMENT: |
            SECRETARY_TOKEN=${{ secrets.SECRETARY_TOKEN }}
            ROUTINE_TOKEN_KEY=${{ secrets.ROUTINE_TOKEN_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
            MICROSOFT_REDIRECT_URI=${{ vars.MICROSOFT_REDIRECT_URI }}
            WEB_ORIGIN=${{ vars.WEB_ORIGIN }}
            CERTBOT_EMAIL=${{ vars.CERTBOT_EMAIL }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            STRIPE_PRICE_MONTHLY=${{ vars.STRIPE_PRICE_MONTHLY }}
            STRIPE_TRIAL_DAYS=${{ vars.STRIPE_TRIAL_DAYS }}
            STRIPE_SUCCESS_URL=${{ vars.STRIPE_SUCCESS_URL }}
            STRIPE_CANCEL_URL=${{ vars.STRIPE_CANCEL_URL }}
            BILLING_ALLOWLIST_EMAILS=${{ vars.BILLING_ALLOWLIST_EMAILS }}
            VITE_PLAN_PRICE_LABEL=${{ vars.VITE_PLAN_PRICE_LABEL }}
        run: bash .github/scripts/deploy-hostinger.sh

      - name: Verify production
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          PROJECT_NAME: mylyfe
          HEALTH_URL: https://feedeo.com.br/api/health
        run: bash .github/scripts/verify-hostinger-containers.sh
